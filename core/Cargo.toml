[package]
name = "blockchainchat-core"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Engineering"]
description = "Decentralized zero-metadata post-quantum resilient messaging engine"

[features]
default = []
oqs_native = ["dep:oqs"]

[dependencies]
# Cryptography & Post-Quantum
vodozemac = "0.6"
oqs = { version = "0.9", features = ["kems"], optional = true }
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
getrandom = "0.2"
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Data Partitioning & Erasure Coding
reed-solomon-erasure = "6.0"

# Serialization & Framing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async & Networking Primitives
tokio = { version = "1.38", features = ["full"] }

# Error Handling & Utilities
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.6"

[dev-dependencies]
tokio-test = "0.4"

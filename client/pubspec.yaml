name: blockchainchat
description: Blockchain-based anonymous chat application
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── Rust FFI Bridge ────────────────────────────────────────────────────────
  flutter_rust_bridge: ^2.9.0

  # ─── State Management ───────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ─── HTTP ───────────────────────────────────────────────────────────────────
  http: ^1.2.0
  crypto: ^3.0.3

  # ─── Crypto ─────────────────────────────────────────────────────────────────
  pointycastle: ^3.9.1
  cryptography: ^2.7.0

  # ─── Local Storage ──────────────────────────────────────────────────────────
  shared_preferences: ^2.3.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # ─── UI ─────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # ─── Blockchain / Web3 ──────────────────────────────────────────────────────
  web3dart: ^2.7.3

  # ─── Utils ──────────────────────────────────────────────────────────────────
  uuid: ^4.4.0
  intl: ^0.19.0
  convert: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/config/

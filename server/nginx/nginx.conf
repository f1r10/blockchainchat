events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Flutter Web App ──────────────────────────────────────
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Flutter web: tüm route-ları index.html-ə yönləndir
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API Proxy-ler ─────────────────────────────────────

        # Discovery API
        location /api/ {
            proxy_pass http://discovery:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
        }

        # Relay nodes
        location /relay1/ {
            proxy_pass http://relay1:3000/;
            proxy_set_header Host $host;
        }
        location /relay2/ {
            proxy_pass http://relay2:3000/;
            proxy_set_header Host $host;
        }
        location /relay3/ {
            proxy_pass http://relay3:3000/;
            proxy_set_header Host $host;
        }

        # Mailbox nodes
        location /mailbox1/ {
            proxy_pass http://mailbox1:4000/;
            proxy_set_header Host $host;
        }
        location /mailbox2/ {
            proxy_pass http://mailbox2:4000/;
            proxy_set_header Host $host;
        }
        location /mailbox3/ {
            proxy_pass http://mailbox3:4000/;
            proxy_set_header Host $host;
        }
        location /mailbox4/ {
            proxy_pass http://mailbox4:4000/;
            proxy_set_header Host $host;
        }
        location /mailbox5/ {
            proxy_pass http://mailbox5:4000/;
            proxy_set_header Host $host;
        }

        # Blockchain RPC (dev only!)
        location /rpc {
            proxy_pass http://blockchain:8545;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }

        # Health aggregator
        location /status {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"blockchainchat"}';
        }
    }
}
